app = "tapesynth-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/tapesynth.db"
  PRO_JOB_PRICE_WEI = "5000000000000000"
  SYNTH_CONCURRENCY = "2"
  XLAYER_RPC = "https://rpc.xlayer.tech"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/v1/health"
  interval = "30s"
  timeout = "10s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
